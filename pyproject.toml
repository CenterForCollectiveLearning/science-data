[project]
name = "ccl_science_data"
dynamic = ["version", "description"]
authors = [{name = "Endre Márk Borza", email = "endre.borza@uni-corvinus.hu"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"pandas>=3.0.0",
	"polars==1.12.0",
	"python-dotenv>=1.0.1",
	"tqdm==4.66.6"
]

[project.urls]
Homepage = "https://github.com/CenterForCollectiveLearning/science-data"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"
